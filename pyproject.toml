[project]
name = "django-trmnl-byos"
version = "2026.10.7"
description = "Drive TRMNL e-ink dashboards from Django: BYOS device API, plugins, playlists, and fluid mashups."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jeff Triplett", email = "jeff.triplett@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "blessed",
    "django>=6.0,<6.1",
    "django-q2>=1.8",
    "icalendar>=7.0",
    "pillow>=11.0",
    "playwright==1.63.0",
    "recurring-ical-events>=3.8",
]

[project.optional-dependencies]
liquid = ["python-liquid>=2.0"]
# For django_trmnl_byos.mcp_tools: add the tools to a django-mcpz MCP server.
mcp = ["django-mcpz>=1.0.5", "msgspec>=0.19"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "python-liquid>=2.0",
]
project = [
    "django-browser-reload>=1.21.0",
    "django-health-check==4.3.0",
    "django-mcpz>=1.0.5",
    "django-prodserver[gunicorn]>=3.0.0",
    "django-tailwind-cli>=4.8.1",
    "environs[django]>=15.2.0",
    "msgspec>=0.19",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[tool.uv]
# Like jefftriplett/django-startproject: apps live at the repo root next to config/.
package = false
# The project's (config/) dependencies install by default for local development.
default-groups = ["dev", "project"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_trmnl_byos"]

[tool.hatch.build.targets.sdist]
include = ["django_trmnl_byos", "README.md", "NOTES.md"]

[tool.coverage.run]
omit = [
    "*/admin.py",
    "*/manage.py",
    "*/migrations/*",
    "*/tests/*",
    "conftest.py",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["render: needs a Playwright Chromium browser (run with -m render)"]
addopts = "-m 'not render'"

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "migrations",
    "node_modules",
    "staticfiles",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = ["A", "B", "C", "D", "E", "F"]
ignore = ["E501", "E741"]
select = ["E", "F"]

[tool.bumpver]
commit = true
commit_message = ":bookmark: bump version {old_version} -> {new_version}"
current_version = "2026.10.7"
push = false  # disabled for GitHub Actions
tag = true
version_pattern = "YYYY.MM.INC1"

[tool.bumpver.file_patterns]
"django_trmnl_byos/__init__.py" = [
  '__version__ = "{version}"'
]
"pyproject.toml" = [
  'version = "{version}"'
]
