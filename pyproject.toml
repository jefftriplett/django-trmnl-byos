[project]
name = "django-trmnl"
version = "0.1.0"
description = "Drive TRMNL e-ink dashboards from Django: BYOS device API, plugins, playlists, and fluid mashups."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jeff Triplett", email = "jeff.triplett@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "django>=5.2",
    "pillow>=11.0",
    "playwright>=1.50",
]

[project.optional-dependencies]
liquid = ["python-liquid>=2.0"]

[dependency-groups]
dev = [
    "django-tailwind-cli>=4.8.1",
    "pytest>=8",
    "pytest-django>=4.9",
    "python-liquid>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_trmnl"]

[tool.hatch.build.targets.sdist]
include = ["src/django_trmnl", "README.md", "NOTES.md"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example.settings"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["render: needs a Playwright Chromium browser (run with -m render)"]
addopts = "-m 'not render'"
