[project]
name = "django-trmnl-byos"
version = "0.1.0"
description = "Drive TRMNL e-ink dashboards from Django: BYOS device API, plugins, playlists, and fluid mashups."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jeff Triplett", email = "jeff.triplett@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "django>=6.0,<6.1",
    "django-q2>=1.8",
    "icalendar>=7.0",
    "pillow>=11.0",
    "playwright>=1.50",
    "recurring-ical-events>=3.8",
]

[project.optional-dependencies]
liquid = ["python-liquid>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "python-liquid>=2.0",
]
project = [
    "django-browser-reload>=1.21.0",
    "django-health-check>=4.0.0",
    "django-prodserver[gunicorn]>=3.0.0",
    "django-tailwind-cli>=4.8.1",
    "environs[django]>=15.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[tool.uv]
# Like jefftriplett/django-startproject: apps live at the repo root next to config/.
package = false
# The project's (config/) dependencies install by default for local development.
default-groups = ["dev", "project"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_trmnl_byos"]

[tool.hatch.build.targets.sdist]
include = ["django_trmnl_byos", "README.md", "NOTES.md"]

[tool.coverage.run]
omit = [
    "*/admin.py",
    "*/manage.py",
    "*/migrations/*",
    "*/tests/*",
    "conftest.py",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["render: needs a Playwright Chromium browser (run with -m render)"]
addopts = "-m 'not render'"

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "migrations",
    "node_modules",
    "staticfiles",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = ["A", "B", "C", "D", "E", "F"]
ignore = ["E501", "E741"]
select = ["E", "F"]
