name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Tests with Python

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'
      SECRET_KEY: 'for-testing'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Enable caching
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Install Chromium for the render tests
        run: uv run --locked playwright install --with-deps chromium

      - name: Test with pytest
        run: uv run --locked -m pytest

      - name: Render tests (real Chromium)
        run: uv run --locked -m pytest -m render
