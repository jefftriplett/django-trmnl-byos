x-common-settings: &common-settings
  build:
    context: .
    dockerfile: Dockerfile
    target: release
  depends_on:
    db:
      condition: service_healthy
  environment:
    - "ALLOWED_HOSTS=*"
    - "DATABASE_URL=postgres://postgres@db/postgres"
    - "DJANGO_DEBUG=true"
    # Renders talk to the `browser` container instead of launching a
    # local Chromium, so the app image ships no browser at all.
    - "PLAYWRIGHT_WS_ENDPOINT=ws://browser:3000/"
    # Keep the project venv OUT of /src so the host bind-mount below can't
    # shadow it. Otherwise `uv run` rebuilds the venv on every invocation.
    - "UV_PROJECT_ENVIRONMENT=/opt/venv"
  env_file: .env
  # Both networks: the app needs db (default) and the browser (browsernet).
  # Declaring this anywhere means the implicit `default` is no longer
  # automatic, so it has to be listed.
  networks:
    - default
    - browsernet
  tty: true
  volumes:
    - .:/src:cache
    - django-tailwind-cli-data:/src/.django_tailwind_cli

services:
  browser:
    build:
      context: .
      # The Playwright version lives in Dockerfile.browser and must match the
      # `playwright` pin in pyproject.toml; test_browser.py checks they agree.
      dockerfile: Dockerfile.browser
    # No `ports:` on purpose. The websocket hands whoever reaches it full
    # control of a browser, so it stays on the compose network only.
    networks:
      - browsernet
    healthcheck:
      test: [ "CMD-SHELL", "/src/healthcheck-browser.sh" ]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 3
    init: true

  db:
    image: "pgautoupgrade/pgautoupgrade:17-alpine"
    volumes:
      - .:/src:cache
      - postgres-data:/var/lib/postgresql/data/
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"
    healthcheck:
      # CMD-SHELL takes a single command string; passing args as extra list
      # items silently drops them. Use the full command as one string.
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres -q" ]
      # `start_interval` (Docker 25+) lets us poll aggressively during boot
      # and relax once the container is healthy.
      interval: 30s
      start_interval: 1s
      start_period: 20s
      timeout: 3s
      retries: 5
    user: postgres
    init: true

  tailwind:
    command: [ "/src/start-tailwind.sh" ]
    <<: *common-settings
    init: true

  utility:
    command: [ "uv", "run", "--no-sync", "-m", "manage", "--version" ]
    entrypoint: [ "/src/compose-entrypoint.sh" ]
    <<: *common-settings

  web:
    depends_on:
      # Repeats db because this key overrides *common-settings entirely —
      # YAML merge keys replace, they don't deep-merge.
      browser:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    command: [ "/src/start-dev.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "/src/healthcheck-web.sh" ]
      interval: 30s
      start_interval: 2s
      start_period: 60s
      timeout: 5s
      retries: 3
    <<: *common-settings
    init: true

  worker:
    depends_on:
      # Repeats db because this key overrides *common-settings entirely —
      # YAML merge keys replace, they don't deep-merge.
      browser:
        condition: service_healthy
      db:
        condition: service_healthy
    command: [ "/src/start-worker.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "/src/healthcheck-worker.sh" ]
      interval: 30s
      start_interval: 3s
      start_period: 60s
      timeout: 10s
      retries: 3
    <<: *common-settings
    init: true

networks:
  # Default network carries the app and its database. The browser is kept
  # off it: markup we render is untrusted, and the strongest guarantee
  # that it can't reach Postgres is having no route to it.
  default:
  browsernet:

volumes:
  django-tailwind-cli-data:
  postgres-data:
