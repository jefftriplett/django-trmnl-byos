<div class="field">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="flex items-center gap-2 font-semibold">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-semibold">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="mt-1 text-xs text-muted">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-sm text-danger">{{ error }}</p>{% endfor %}
</div>
